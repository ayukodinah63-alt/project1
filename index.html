<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f6f2">
    <title>Tiny JavaScript Lab</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #18312e;
            --muted: #647572;
            --paper: #f3f6f2;
            --surface: #ffffff;
            --line: #dce6e0;
            --green: #176b57;
            --green-dark: #105342;
            --coral: #e77c62;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1080px;
            min-height: 76px;
            margin: 0 auto;
            padding: 0 28px;
            border-bottom: 1px solid var(--line);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            font-size: 15px;
            font-weight: 700;
        }

        .brand-mark {
            display: grid;
            width: 34px;
            height: 34px;
            place-items: center;
            border-radius: 10px;
            background: var(--green);
            color: white;
            font-family: Georgia, serif;
            font-size: 20px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 13px;
        }

        .status::before {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #43a77e;
            content: "";
        }

        main {
            width: min(100% - 40px, 760px);
            margin: 72px auto 96px;
        }

        .eyebrow {
            margin: 0 0 13px;
            color: var(--green);
            font-size: 12px;
            font-weight: 750;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        h1 {
            max-width: 620px;
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(38px, 7vw, 58px);
            font-weight: 400;
            line-height: 1.08;
        }

        .intro {
            max-width: 500px;
            margin: 18px 0 38px;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.65;
        }

        .workspace {
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            box-shadow: 0 16px 40px rgb(24 49 46 / 6%);
        }

        .workspace-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 54px;
            padding: 0 20px;
            border-bottom: 1px solid var(--line);
            color: var(--muted);
            font-size: 13px;
        }

        .workspace-head strong {
            color: var(--ink);
            font-size: 13px;
        }

        .workspace-body { padding: 26px 20px 22px; }

        .message {
            min-height: 30px;
            margin: 0 0 24px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 24px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            min-height: 42px;
            padding: 0 15px;
            border: 1px solid var(--green);
            border-radius: 5px;
            background: var(--green);
            color: white;
            cursor: pointer;
            font: inherit;
            font-size: 14px;
            font-weight: 650;
            transition: background 150ms ease, transform 150ms ease;
        }

        button:hover { background: var(--green-dark); }
        button:active { transform: translateY(1px); }
        button:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }

        button.secondary {
            border-color: var(--line);
            background: white;
            color: var(--ink);
        }

        button.secondary:hover { background: #f3f6f2; }

        .time-output {
            min-height: 24px;
            margin: 18px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        @media (max-width: 520px) {
            .topbar { min-height: 66px; padding: 0 20px; }
            main { width: min(100% - 36px, 760px); margin-top: 48px; }
            .intro { margin-bottom: 28px; }
            .workspace-body { padding: 22px 16px 18px; }
            .workspace-head { padding: 0 16px; }
            .actions button { flex: 1 1 100%; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true">{ }</span> Tiny JavaScript Lab</div>
        <div class="status">Ready to try</div>
    </header>

    <main>
        <p class="eyebrow">A little place to begin</p>
        <h1>Make something happen.</h1>
        <p class="intro">A simple starter page for trying out JavaScript. Use the controls below and see the page respond.</p>

        <section class="workspace" aria-labelledby="workspace-title">
            <div class="workspace-head">
                <strong id="workspace-title">Your first interaction</strong>
                <span>example.js</span>
            </div>
            <div class="workspace-body">
                <p class="message" id="message" aria-live="polite">JavaScript can change things.</p>
                <div class="actions">
                    <button type="button" id="change-message">Change the message</button>
                    <button type="button" class="secondary" id="show-time">Show the time</button>
                </div>
                <p class="time-output" id="time-output" aria-live="polite"></p>
            </div>
        </section>
    </main>

    <script>
        const message = document.querySelector("#message");
        const timeOutput = document.querySelector("#time-output");

        document.querySelector("#change-message").addEventListener("click", () => {
            message.textContent = "Hello, JavaScript!";
        });

        document.querySelector("#show-time").addEventListener("click", () => {
            timeOutput.textContent = new Date().toLocaleString();
        });
    </script>
</body>
</html>
