<!DOCTYPE html>
<html>
<body>

<h2>What Can JavaScript Do?</h2>

<p>JavaScript can change HTML attribute values.</p>

<p>In this case JavaScript changes the value of the src (source) attribute of an image.</p>

<button onclick="document.getElementById('myImage').src='BulbOff.jpeg'">Turn Off the light</button>

<img id="myImage" src="BulbOff.jpeg" style="width:100px">

<button onclick="document.getElementById('myImage').src='BulbOn.jpeg'">Turn On the light</button>

</body>
</html>
